<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phụ Kiện Miband HN - Store</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Animate.css for smooth animations -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <header class="header animate__animated animate__fadeInDown">
      <div class="logo-container">
        <div class="logo-circle">
          <img src="IMG/logo.png" alt="Miband Logo" />
        </div>
        <h1>Phụ Kiện Miband HN</h1>
        <p>Chuyên phụ kiện Xiaomi Mi Band 8, 9, 10</p>
      </div>
    </header>

    <main class="container">
      <div class="product-grid" id="product-list">
        <!-- Product 1 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          onclick="openShopee('https://s.shopee.vn/9KeqHStMFc')"
        >
          <div class="product-img">
            <img src="IMG/sac-nhanh.jpg" alt="Dây sạc nhanh" />
          </div>
          <div class="product-info">
            <h3>Dây sạc nhanh Mi Band 8/9/10</h3>
            <span class="btn-buy">Mua ngay</span>
          </div>
        </div>

        <!-- Product 2 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.1s"
          onclick="openShopee('YOUR_LINK_HERE')"
        >
          <div class="product-img">
            <img src="IMG/day-silicon.jpg" alt="Dây Silicon" />
          </div>
          <div class="product-info">
            <h3>Dây Silicon cao cấp Miband</h3>
            <span class="btn-buy">Mua ngay</span>
          </div>
        </div>

        <!-- Product 3 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.2s"
          onclick="openShopee('YOUR_LINK_HERE')"
        >
          <div class="product-img">
            <img src="IMG/cuong-luc-gor.jpg" alt="Cường lực GOR" />
          </div>
          <div class="product-info">
            <h3>Cường lực GOR chính hãng</h3>
            <span class="btn-buy">Mua ngay</span>
          </div>
        </div>

        <!-- Product 4 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.3s"
          onclick="openShopee('YOUR_LINK_HERE')"
        >
          <div class="product-img">
            <img src="IMG/day-kim-loai.jpg" alt="Dây kim loại" />
          </div>
          <div class="product-info">
            <h3>Dây thép Milansese sang trọng</h3>
            <span class="btn-buy">Mua ngay</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer animate__animated animate__fadeIn">
      <p>© 2026 Phụ Kiện Miband HN. All rights reserved.</p>
    </footer>

    <script src="Js/main.js"></script>
  </body>
</html>
