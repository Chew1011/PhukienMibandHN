<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phụ Kiện Miband HN - Store</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <header class="header animate__animated animate__fadeInDown">
      <div class="logo-container">
        <div class="logo-circle">
          <img src="IMG/logo.png" alt="Miband Logo" />
        </div>
        <h1>Phụ Kiện Miband HN</h1>
        <p>Chuyên phụ kiện Xiaomi Mi Band</p>
      </div>
    </header>

    <main class="container">
      <div class="product-grid">
        <!-- Sản phẩm 1 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          onclick="openShopee('https://urlgeni.us/shopee/92UwtU')"
        >
          <div class="product-img">
            <img src="IMG/sac-nhanh.jpg" alt="Dây sạc nhanh" />
          </div>
          <div class="product-info">
            <h3>Dây sạc nhanh Mi Band 8/9/10</h3>
            <span class="btn-buy">MỞ TRONG APP SHOPEE</span>
          </div>
        </div>

        <!-- Các sản phẩm khác tương tự -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.1s"
          onclick="openShopee('#')"
        >
          <div class="product-img">
            <img src="IMG/day-silicon.jpg" alt="Dây Silicon" />
          </div>
          <div class="product-info">
            <h3>Dây Silicon cao cấp Miband</h3>
            <span class="btn-buy">MỞ TRONG APP SHOPEE</span>
          </div>
        </div>

        <!-- Sản phẩm 3 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.1s"
          onclick="openShopee('#')"
        >
          <div class="product-img">
            <img src="IMG/DayKimLoai1.png" alt="Dây Kim Loại" />
          </div>
          <div class="product-info">
            <h3>Dây Kim Loại Thép không gỉ Miband</h3>
            <span class="btn-buy">MỞ TRONG APP SHOPEE</span>
          </div>
        </div>
        <!-- Sản phẩm 4 -->
        <div
          class="product-card animate__animated animate__fadeInUp"
          style="animation-delay: 0.1s"
          onclick="openShopee('#')"
        >
          <div class="product-img">
            <img src="IMG/daynylong.png" alt="Dây Silicon" />
          </div>
          <div class="product-info">
            <h3>Dây bện Nylong cao cấp Miband</h3>
            <span class="btn-buy">MỞ TRONG APP SHOPEE</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Phụ Kiện Miband HN</p>
    </footer>

    <script src="Js/main.js"></script>
  </body>
</html>
